<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install 2View</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 380px;
            width: 100%;
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { color: #6e6e73; font-size: 15px; line-height: 1.4; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #0071e3;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            padding: 14px 28px;
            border-radius: 980px;
            margin-bottom: 16px;
        }
        .sub {
            display: block;
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
            margin-top: 12px;
        }
        .note {
            margin-top: 24px;
            font-size: 13px;
            color: #86868b;
            text-align: left;
            background: #f5f5f7;
            padding: 12px 16px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>2View</h1>
        <p>Version 1.0 (com.unigrok.i2view)<br>Signed for DavePhone &amp; bnl-iphone</p>
        <a class="btn" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/drbart/2View-releases/main/releases/manifest.plist">
            Install on iPhone (OTA)
        </a>
        <a class="sub" href="https://raw.githubusercontent.com/drbart/2View-releases/main/releases/2View.ipa">
            Download 2View.ipa directly
        </a>
        <div class="note">
            <strong>Note:</strong> Open this page in <strong>Safari</strong> on your iPhone to install directly. Make sure <em>Settings → Privacy &amp; Security → Developer Mode</em> is turned ON.
        </div>
    </div>
</body>
</html>
